name: docs-build

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/docs-pages.yml'
  push:
    branches: [main, dev]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-build.yml'
      - '.github/workflows/docs-pages.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify no i18n docs shadow
        run: |
          test ! -d i18n/zh-Hans/docusaurus-plugin-content-docs \
            && echo "OK: no i18n docs shadow" \
            || { echo "FAIL: i18n docs shadow detected — remove i18n/zh-Hans/docusaurus-plugin-content-docs"; exit 1; }

      - name: Verify no orphan doc directories
        run: |
          for d in ai-basics getting-started core-sdk/chat core-sdk/responses agent/runtimes agent/orchestration; do
            test ! -d "docs/$d" \
              && echo "OK: docs/$d removed" \
              || { echo "FAIL: docs/$d still exists — orphan directories must not be reintroduced"; exit 1; }
          done

      - name: Typecheck docs
        run: npm run typecheck

      - name: Build docs
        run: npm run build
